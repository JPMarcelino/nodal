<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const stored = localStorage.getItem('theme');
      const preferred = window.matchMedia('(prefers-color-scheme: light)').matches
        ? 'light'
        : 'dark';
      document.documentElement.dataset.theme = stored || preferred;
    </script>
    <title>Angular Circuit Diagram Editor - Live Demo | ngDiagram</title>
    <meta
      name="description"
      content="Draw electronic circuit schematics in the browser: drag components from a library, wire them port-to-port, add junctions, export to DXF, SVG, JPEG, or JSON. An open-source Angular starter built on ngDiagram."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
