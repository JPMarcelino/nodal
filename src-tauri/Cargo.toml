[package]
name = "nodal"
version = "1.0.0"
description = "Nodal — circuit & schematic designer"
authors = ["JPMarcelino"]
license = "MIT"
edition = "2021"

[lib]
name = "nodal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
